<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenMarko: more customers from Google, no agency needed</title>
    <meta
      name="description"
      content="Enter your website. OpenMarko finds what stops people nearby from finding you on Google Maps, Google search and ChatGPT, and fixes it with you."
    />
    <meta property="og:title" content="OpenMarko: more customers from Google, no agency needed" />
    <meta
      property="og:description"
      content="Local SEO for owners: your rank from up to 81 spots around your door, Google search, AI answers and one-click fixes."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      // Apply the saved theme before first paint. Light is the default.
      try {
        if (localStorage.getItem("site-theme") === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Frank+Ruhl+Libre:wght@400;500&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
